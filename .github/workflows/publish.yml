name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@aliou"
          cache: pnpm

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Get release info
        id: release-info
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const pkg = require('./package.json');

          const bumps = { patch: 0, minor: 1, major: 2 };
          const changesetDir = '.changeset';
          const changesets = fs.existsSync(changesetDir)
            ? fs.readdirSync(changesetDir).filter((file) => file.endsWith('.md'))
            : [];

          let bump = undefined;
          for (const file of changesets) {
            const text = fs.readFileSync(path.join(changesetDir, file), 'utf8');
            const match = text.match(new RegExp(`^["']?${pkg.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}["']?:\\s*(patch|minor|major)`, 'm'));
            if (!match) continue;
            if (!bump || bumps[match[1]] > bumps[bump]) bump = match[1];
          }

          const version = pkg.version.split('.').map(Number);
          if (bump === 'major') {
            version[0] += 1;
            version[1] = 0;
            version[2] = 0;
          } else if (bump === 'minor') {
            version[1] += 1;
            version[2] = 0;
          } else if (bump === 'patch') {
            version[2] += 1;
          }

          const releaseName = pkg.name + '@' + version.join('.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'title=Updating ' + releaseName + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'commit=' + releaseName + '\n');
          NODE

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: ${{ steps.release-info.outputs.title || 'Updating @aliou/vite-plugin-obsidian' }}
          commit: ${{ steps.release-info.outputs.commit || '@aliou/vite-plugin-obsidian' }}
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Update release PR title
        if: steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.release-info.outputs.title }}
        run: |
          PR=$(gh pr list --head changeset-release/main --state open --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE"
          fi

      - name: Create GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="$PACKAGE_NAME@$VERSION"
          if ! gh release view "$TAG" &>/dev/null; then
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG"
          fi
